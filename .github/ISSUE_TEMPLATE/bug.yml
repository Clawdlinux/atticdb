name: Bug
description: Something broke or did the wrong thing.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please don't paste tokens or private memory content.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. atticdb setup --harness vscode
        2. ...
  - type: textarea
    id: doctor
    attributes:
      label: atticdb doctor output
      description: Run `atticdb doctor` and paste the output. It holds no tokens.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `atticdb --version`, the first line of `atticdb doctor`, or the commit you built from.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [macOS, Linux, Other]
    validations:
      required: true
  - type: checkboxes
    id: apps
    attributes:
      label: Apps involved
      options:
        - label: VS Code
        - label: Copilot CLI
        - label: Claude Code
        - label: Codex
        - label: Another app or my own client
