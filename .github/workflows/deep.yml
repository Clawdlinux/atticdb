# Slow checks: power loss on a real filesystem, and the sims with a large seed budget.
# Nightly, on demand, and on pull requests that touch the tape or this harness.
name: deep
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: Power cuts per run
        default: "20"
      seed:
        description: Power-loss seed, empty for random
        default: ""
  pull_request:
    paths:
      - crates/atticdb-tape/src/**
      - tests/crash/**
      - .github/workflows/deep.yml
permissions:
  contents: read
concurrency:
  group: deep-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  # Each round rereads all data so far, so long runs slow down. Nightly runs 3 fresh 20-cut
  # runs in parallel instead of 1 long one. 20 cuts take about 10 minutes.
  power-loss:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON((github.event_name == 'pull_request' || inputs.seed != '') && '[1]' || '[1, 2, 3]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get install -y --no-install-recommends g++ cmake libfuse3-dev fuse3
      - run: sudo sed -i 's/^#\s*user_allow_other/user_allow_other/' /etc/fuse.conf
      - id: lazyfs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/lazyfs
          key: lazyfs-${{ hashFiles('tests/crash/build-lazyfs.sh') }}-ubuntu-24.04
      - if: steps.lazyfs.outputs.cache-hit != 'true'
        run: tests/crash/build-lazyfs.sh ~/lazyfs
      - run: cargo build --locked --release -p atticdb
      - run: python3 tests/crash/power_loss.py --lazyfs ~/lazyfs
        env:
          LD_LIBRARY_PATH: /home/runner/lazyfs/libs/libpcache/build
          ATTICDB_CRASH_ROUNDS: ${{ inputs.rounds || '20' }}
          ATTICDB_CRASH_SEED: ${{ inputs.seed }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: power-loss-logs-${{ matrix.run }}
          path: |
            target/power-loss/*.log
            target/power-loss/*.out
          if-no-files-found: ignore

  sims:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ATTICDB_SIM_SEEDS: "20000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # A new window of seeds each run. Failures print the seed to rerun.
      - run: echo "ATTICDB_SIM_SEED=$((GITHUB_RUN_NUMBER * ATTICDB_SIM_SEEDS))" >> "$GITHUB_ENV"
      - run: cargo test --locked -p atticdb-tape --release --features sim --test sim
      - run: cargo test --locked -p atticdb-core --release --features sim --test engine_sim
