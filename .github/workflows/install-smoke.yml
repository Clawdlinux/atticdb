name: install-smoke
# Installs the live release on a fresh Linux or macOS runner, as a new user would, then uses it.
# It never checks out the repo. The user has curl and nothing else.
on:
  release:
    types: [published]
  # release.yml publishes with GITHUB_TOKEN, and such a release fires no release event.
  # So this runs after a successful release.yml run from a tag push, the schedule or a dispatch.
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Release to install, such as 0.1.0. Empty means latest."
        required: false
        default: ""
  schedule:
    # Wednesdays at 04:37 UTC.
    - cron: "37 4 * * 3"
  pull_request:
    paths:
      - .github/workflows/install-smoke.yml
permissions:
  contents: read
concurrency:
  group: install-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  smoke:
    if: >-
      github.event_name != 'workflow_run' ||
      (contains(fromJSON('["push", "schedule", "workflow_dispatch"]'),
      github.event.workflow_run.event) &&
      github.event.workflow_run.conclusion == 'success')
    name: smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    env:
      EVENT: ${{ github.event_name }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RUN_EVENT: ${{ github.event.workflow_run.event }}
      RUN_TAG: ${{ github.event.workflow_run.head_branch }}
      INPUT_VERSION: ${{ inputs.version }}
      RELEASES: https://github.com/Clawdlinux/atticdb/releases
    steps:
      # A short path: macOS allows 104 bytes for a socket path.
      - name: Make a fresh home
        run: |
          # The checks use jq outside the fresh home. Runner images have it, so this is a fallback.
          if ! command -v jq >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q jq
          fi
          dir=$(mktemp -d /tmp/s.XXXX)
          # macOS /tmp is a symlink. The binary records real paths.
          dir=$(cd "$dir" && pwd -P)
          home="$dir/h"
          mkdir -m 700 "$home" "$home/proj"
          case "$(uname -s)" in
            Darwin)
              data="$home/Library/Application Support/atticdb/data"
              code="$home/Library/Application Support/Code/User"
              ;;
            *)
              data="$home/.local/share/atticdb/data"
              code="$home/.config/Code/User"
              ;;
          esac
          cat > "$dir/lib.sh" <<'EOF'
          # u <seconds> <command> [args]: runs a command as the new user. The environment
          # holds only HOME and PATH, and SIGALRM kills the command after <seconds>.
          u() {
              secs=$1
              shift
              # shellcheck disable=SC2016 # perl code, not shell
              env -i HOME="$SMOKE_HOME" PATH="$SMOKE_HOME/.local/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
                  perl -e 'alarm shift; exec { $ARGV[0] } @ARGV or die "cannot run $ARGV[0]: $!\n"' \
                  "$secs" "$@"
          }
          EOF
          {
            echo "SMOKE_DIR=$dir"
            echo "SMOKE_LIB=$dir/lib.sh"
            echo "SMOKE_HOME=$home"
            echo "SMOKE_PROJ=$home/proj"
            echo "SMOKE_DATA=$data"
            echo "SMOKE_CODE=$code"
          } >> "$GITHUB_ENV"
          echo "home: $home"

      - name: Install with curl | sh
        # The alarm stops only the direct child. This bounds curl and sh too.
        timeout-minutes: 3
        run: |
          # shellcheck source=/dev/null
          . "$SMOKE_LIB"
          case "$EVENT" in
            release) want=$RELEASE_TAG ;;
            # A tag push names its tag. A scheduled or manual run ran on main, so test latest.
            workflow_run)
              if [ "$RUN_EVENT" = push ]; then
                want=$RUN_TAG
              else
                want=
              fi
              ;;
            workflow_dispatch) want=$INPUT_VERSION ;;
            *) want= ;;
          esac
          cd "$SMOKE_HOME"
          # pipefail, so a failed download fails the step. sh alone would run an empty script.
          # The inner bash expands $1.
          # shellcheck disable=SC2016
          install='set -o pipefail; curl -fsSL "$1" | sh'
          if [ -n "$want" ]; then
            want=${want#v}
            out=$(u 120 env ATTICDB_VERSION="$want" bash -c "$install" sh "$RELEASES/latest/download/install.sh")
          else
            # The tag that latest names, to check --version against.
            tag=$(curl -fsSLI -o /dev/null -w '%{url_effective}' "$RELEASES/latest")
            want=${tag##*/tag/v}
            if [ "$want" = "$tag" ] || [ -z "$want" ]; then
              echo "::error::cannot read the latest tag from $tag"
              exit 1
            fi
            out=$(u 120 bash -c "$install" sh "$RELEASES/latest/download/install.sh")
          fi
          echo "$out"
          case "$out" in
            *warning:*) echo "::error::the installer warned"; exit 1 ;;
          esac
          found=$(u 10 sh -c 'command -v atticdb')
          if [ "$found" != "$SMOKE_HOME/.local/bin/atticdb" ]; then
            echo "::error::atticdb on PATH is '$found', want $SMOKE_HOME/.local/bin/atticdb"
            exit 1
          fi
          got=$(u 10 atticdb --version)
          if [ "$got" != "atticdb $want" ]; then
            echo "::error::atticdb --version printed '$got', want 'atticdb $want'"
            exit 1
          fi
          echo "$got"

      - name: First use
        run: |
          # shellcheck source=/dev/null
          . "$SMOKE_LIB"
          cd "$SMOKE_PROJ"
          # The first command makes the home and starts the server.
          if ! u 30 atticdb append --content "smoke note" > "$SMOKE_DIR/append.out" 2> "$SMOKE_DIR/append.err"; then
            cat "$SMOKE_DIR/append.out" "$SMOKE_DIR/append.err"
            echo "::error::the first append failed"
            exit 1
          fi
          echo "::group::stderr of the first append"
          cat "$SMOKE_DIR/append.err"
          echo "::endgroup::"
          jq -e '.committed == true' "$SMOKE_DIR/append.out"
          u 30 atticdb fact set --key user/smoke --content ok | jq -e '.committed == true'
          u 30 atticdb search --query smoke | jq -e 'any(.hits[]; .content == "smoke note")'
          u 30 atticdb fact get --key user/smoke | jq -e '.fact.content == "ok"'
          u 30 atticdb recent --n 1 | jq -e '.turns | length == 1 and .[0].content == "smoke note"'

      # VS Code counts as installed when its user profile dir exists.
      - name: Set up VS Code and run doctor
        run: |
          # shellcheck source=/dev/null
          . "$SMOKE_LIB"
          cd "$SMOKE_PROJ"
          mkdir -p "$SMOKE_CODE"
          u 60 atticdb setup --yes --harness vscode
          jq -e --arg exe "$SMOKE_HOME/.local/bin/atticdb" \
            '.servers.atticdb.type == "stdio" and .servers.atticdb.command == $exe' "$SMOKE_CODE/mcp.json"
          jq -e '.hooks.sessionStart[0].bash | endswith(" hook session-start")' \
            "$SMOKE_HOME/.copilot/hooks/atticdb.json"
          grep -q 'atticdb' "$SMOKE_HOME/.copilot/instructions/atticdb.instructions.md"
          if ! u 60 atticdb doctor > "$SMOKE_DIR/doctor.out"; then
            cat "$SMOKE_DIR/doctor.out"
            echo "::error::atticdb doctor failed"
            exit 1
          fi
          cat "$SMOKE_DIR/doctor.out"
          # The VS Code section, up to the next unindented line.
          vscode=$(awk '/^VS Code:/ { on = 1; next } /^[^ ]/ { on = 0 } on' "$SMOKE_DIR/doctor.out")
          for check in parts binary hook; do
            if ! printf '%s\n' "$vscode" | grep -qx "  $check: ok"; then
              echo "::error::doctor did not report VS Code $check: ok"
              exit 1
            fi
          done

      # Runs what VS Code would: the command, args and env of the mcp.json entry.
      - name: MCP round trip
        run: |
          # shellcheck source=/dev/null
          . "$SMOKE_LIB"
          cd "$SMOKE_PROJ"
          entry=$(jq -c '.servers.atticdb' "$SMOKE_CODE/mcp.json")
          echo "entry: $entry"
          set --
          while IFS= read -r pair; do set -- "$@" "$pair"; done < <(jq -r '.env // {} | to_entries[] | "\(.key)=\(.value)"' <<< "$entry")
          set -- "$@" "$(jq -r '.command' <<< "$entry")"
          while IFS= read -r arg; do set -- "$@" "$arg"; done < <(jq -r '.args[]' <<< "$entry")
          # The adapter exits when stdin closes, after answering each request.
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"install-smoke","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"memory_search","arguments":{"query":"smoke"}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"fact_get","arguments":{"key":"user/smoke"}}}' |
            u 30 env "$@" > "$SMOKE_DIR/mcp.out"
          cat "$SMOKE_DIR/mcp.out"
          jq -se '
            (map(.id) == [1, 2, 3, 4]) and
            (.[0].result.serverInfo.name == "atticdb") and
            ([.[1].result.tools[].name] | sort ==
              ["fact_get", "fact_list", "fact_set", "memory_append", "memory_recent", "memory_search"]) and
            (.[2].result.isError != true) and
            (.[2].result.content[0].text | contains("smoke note")) and
            (any(.[2].result.structuredContent.hits[]; .content == "smoke note")) and
            (.[3].result.isError != true) and
            (.[3].result.content[0].text == "ok")
          ' "$SMOKE_DIR/mcp.out"

      # Runs the sessionStart hook as Copilot would, with its JSON on stdin.
      - name: Session-start hook
        run: |
          # shellcheck source=/dev/null
          . "$SMOKE_LIB"
          hook=$(jq -c '.hooks.sessionStart[0]' "$SMOKE_HOME/.copilot/hooks/atticdb.json")
          echo "hook: $hook"
          set --
          while IFS= read -r pair; do set -- "$@" "$pair"; done < <(jq -r '.env // {} | to_entries[] | "\(.key)=\(.value)"' <<< "$hook")
          jq -nc --arg cwd "$SMOKE_PROJ" '{cwd: $cwd}' |
            u 10 env "$@" bash -c "$(jq -r '.bash' <<< "$hook")" > "$SMOKE_DIR/hook.out"
          cat "$SMOKE_DIR/hook.out"
          jq -e '.additionalContext | contains("AtticDB memory") and contains("smoke note")
            and contains("user/smoke: ok")' "$SMOKE_DIR/hook.out"

      - name: Server log
        if: failure()
        run: tail -n 50 "$SMOKE_DATA/serve.log" || true

      # Stops the server the first command started, by the pid in its LOCK, never by name.
      - name: Clean up
        if: always()
        run: |
          [ -n "${SMOKE_DIR:-}" ] || exit 0
          lock="$SMOKE_DATA/LOCK"
          pid=$(sed -n 's/^pid=\([0-9][0-9]*\) .*/\1/p' "$lock" 2>/dev/null || true)
          # A stale LOCK may name a pid that another program now has.
          if [ -n "$pid" ] && ps -p "$pid" -o comm= | grep -q atticdb && kill "$pid"; then
            for _ in $(seq 50); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 0.2
            done
            if kill -0 "$pid" 2>/dev/null; then
              echo "::warning::server $pid did not stop in 10 s"
            fi
          fi
          rm -rf "$SMOKE_DIR"

  # Windows has no installer. A new user downloads the zip, checks it against SHA256SUMS and
  # puts atticdb.exe on PATH. A release from before v0.2.0 has no zip, so the job then skips
  # with a notice. Each command runs as that user, by the u function, in a fresh profile.
  windows:
    if: >-
      github.event_name != 'workflow_run' ||
      (contains(fromJSON('["push", "schedule", "workflow_dispatch"]'),
      github.event.workflow_run.event) &&
      github.event.workflow_run.conclusion == 'success')
    name: smoke windows-latest
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      EVENT: ${{ github.event_name }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RUN_EVENT: ${{ github.event.workflow_run.event }}
      RUN_TAG: ${{ github.event.workflow_run.head_branch }}
      INPUT_VERSION: ${{ inputs.version }}
      RELEASES: https://github.com/Clawdlinux/atticdb/releases
      ZIP: atticdb-x86_64-pc-windows-msvc.zip
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - name: TEMP build a local zip
        env:
          ATTICDB_RELEASE_VERSION: 9.9.9
        run: |
          cargo build --locked --release -p atticdb
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Path target\release\atticdb.exe, README.md, LICENSE-APACHE, LICENSE-MIT -Destination $stage
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path $env:RUNNER_TEMP "local-$env:ZIP")
      - name: Find the release
        id: release
        run: |
          $local = Join-Path $env:RUNNER_TEMP "local-$env:ZIP"
          if (Test-Path $local) {
            $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $local).Hash.ToLowerInvariant()
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'skip=false', 'version=9.9.9', "sha256=$sha"
            exit 0
          }
          switch ($env:EVENT) {
            'release' { $want = $env:RELEASE_TAG }
            # A tag push names its tag. A scheduled or manual run ran on main, so test latest.
            'workflow_run' { $want = if ($env:RUN_EVENT -eq 'push') { $env:RUN_TAG } else { '' } }
            'workflow_dispatch' { $want = $env:INPUT_VERSION }
            default { $want = '' }
          }
          if (-not $want) {
            # The tag that latest names.
            $latest = Invoke-WebRequest -Uri "$env:RELEASES/latest" -Method Head -MaximumRetryCount 3 -RetryIntervalSec 5
            $url = $latest.BaseResponse.RequestMessage.RequestUri.AbsoluteUri
            if ($url -notmatch '/tag/(v[^/]+)$') {
              Write-Output "::error::cannot read the latest tag from $url"
              exit 1
            }
            $want = $Matches[1]
          }
          $want = $want -replace '^v', ''
          $sums = Join-Path $env:RUNNER_TEMP 'SHA256SUMS'
          Invoke-WebRequest -Uri "$env:RELEASES/download/v$want/SHA256SUMS" -OutFile $sums -MaximumRetryCount 3 -RetryIntervalSec 5
          $line = Get-Content $sums | Where-Object { $_ -like "*  $env:ZIP" } | Select-Object -First 1
          $sha = if ($line -match '^([0-9a-f]{64})  ') { $Matches[1] } else { '' }
          if (-not $sha) {
            Write-Output "::notice::release v$want has no $env:ZIP, so the Windows smoke test is skipped. Releases from v0.2.0 on have it."
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'skip=true'
            exit 0
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value 'skip=false', "version=$want", "sha256=$sha"
          Write-Output "testing v$want, $env:ZIP $sha"

      - name: Install from the zip
        if: steps.release.outputs.skip == 'false'
        env:
          WANT: ${{ steps.release.outputs.version }}
          WANT_SHA: ${{ steps.release.outputs.sha256 }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP ('s' + [guid]::NewGuid().ToString('N').Substring(0, 8))
          $user = Join-Path $dir 'h'
          $bin = Join-Path $user 'bin'
          $folders = "$user\proj", "$user\AppData\Roaming", "$user\AppData\Local", $bin, "$dir\tmp"
          New-Item -ItemType Directory -Force -Path $folders | Out-Null
          $zip = Join-Path $dir $env:ZIP
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "local-$env:ZIP") -Destination $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:WANT_SHA) {
            Write-Output "::error::$env:ZIP has SHA-256 $hash, but SHA256SUMS says $env:WANT_SHA"
            exit 1
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $bin
          $names = (Get-ChildItem -LiteralPath $bin | ForEach-Object Name | Sort-Object) -join ','
          if ($names -ne 'atticdb.exe,LICENSE-APACHE,LICENSE-MIT,README.md') {
            Write-Output "::error::$env:ZIP holds $names"
            exit 1
          }
          $lib = Join-Path $dir 'lib.ps1'
          Set-Content -LiteralPath $lib -Value @'
          # u <seconds> <program> [args] [-Stdin <text>] [-Extra <env>]: runs a program as the new
          # user. Its environment holds the user's folders, PATH, Extra and what Windows needs.
          # It is killed, with every process it started, after <seconds>.
          function u {
              param(
                  [Parameter(Mandatory)][int]$Secs,
                  [Parameter(Mandatory)][string]$Program,
                  [string[]]$Arguments = @(),
                  [string]$Stdin = '',
                  [hashtable]$Extra = @{}
              )
              $info = [System.Diagnostics.ProcessStartInfo]::new($Program)
              foreach ($arg in $Arguments) { $info.ArgumentList.Add($arg) }
              $info.UseShellExecute = $false
              $info.RedirectStandardInput = $true
              $info.RedirectStandardOutput = $true
              $info.RedirectStandardError = $true
              $info.WorkingDirectory = $env:SMOKE_PROJ
              $vars = @{
                  USERPROFILE = $env:SMOKE_HOME
                  APPDATA = "$env:SMOKE_HOME\AppData\Roaming"
                  LOCALAPPDATA = "$env:SMOKE_HOME\AppData\Local"
                  TEMP = "$env:SMOKE_DIR\tmp"
                  TMP = "$env:SMOKE_DIR\tmp"
                  PATH = "$env:SMOKE_BIN;$env:SystemRoot\System32"
                  SystemRoot = $env:SystemRoot
                  SystemDrive = $env:SystemDrive
                  windir = $env:windir
                  ComSpec = $env:ComSpec
                  PATHEXT = $env:PATHEXT
              }
              foreach ($key in $Extra.Keys) { $vars[$key] = $Extra[$key] }
              $info.Environment.Clear()
              foreach ($key in $vars.Keys) { $info.Environment[$key] = $vars[$key] }
              $process = [System.Diagnostics.Process]::Start($info)
              $out = $process.StandardOutput.ReadToEndAsync()
              $err = $process.StandardError.ReadToEndAsync()
              $process.StandardInput.Write($Stdin)
              $process.StandardInput.Close()
              if (-not $process.WaitForExit($Secs * 1000)) {
                  $process.Kill($true)
                  throw "$Program $Arguments did not exit in $Secs s"
              }
              $process.WaitForExit()
              if (-not ($out.Wait(10000) -and $err.Wait(10000))) {
                  throw "$Program $Arguments did not close its output"
              }
              [pscustomobject]@{ Code = $process.ExitCode; Out = $out.Result; Err = $err.Result }
          }

          # ok <result> <what>: the result's stdout, or the step fails when it did not exit 0.
          function ok {
              param($Result, [string]$What)
              if ($Result.Code -ne 0) {
                  Write-Host $Result.Out
                  Write-Host $Result.Err
                  Write-Host "::error::$What exited $($Result.Code)"
                  exit 1
              }
              $Result.Out
          }

          # check <condition> <what>: the step fails, saying what, unless the condition holds.
          function check {
              param([bool]$Condition, [string]$What)
              if (-not $Condition) {
                  Write-Host "::error::$What"
                  exit 1
              }
          }
          '@
          @(
            "SMOKE_DIR=$dir"
            "SMOKE_LIB=$lib"
            "SMOKE_HOME=$user"
            "SMOKE_PROJ=$user\proj"
            "SMOKE_BIN=$bin"
            "SMOKE_EXE=$bin\atticdb.exe"
            "SMOKE_DATA=$user\AppData\Local\atticdb\data"
            "SMOKE_CODE=$user\AppData\Roaming\Code\User"
          ) | Add-Content -Path $env:GITHUB_ENV
          . $lib
          # GITHUB_ENV takes effect in the next step, and u needs these now.
          $env:SMOKE_DIR = $dir
          $env:SMOKE_HOME = $user
          $env:SMOKE_PROJ = "$user\proj"
          $env:SMOKE_BIN = $bin
          $got = (ok (u 10 "$bin\atticdb.exe" @('--version')) 'atticdb --version').Trim()
          check ($got -eq "atticdb $env:WANT") "atticdb --version printed '$got', want 'atticdb $env:WANT'"
          Write-Output $got

      - name: First use
        if: steps.release.outputs.skip == 'false'
        run: |
          . $env:SMOKE_LIB
          $exe = $env:SMOKE_EXE
          # The first command makes the home and starts the server.
          $first = u 30 $exe @('append', '--content', 'smoke note')
          Write-Output '::group::stderr of the first append'
          Write-Output $first.Err
          Write-Output '::endgroup::'
          check ((ok $first 'the first append' | ConvertFrom-Json).committed -eq $true) 'the first append did not commit'
          $set = ok (u 30 $exe @('fact', 'set', '--key', 'user/smoke', '--content', 'ok')) 'fact set'
          check (($set | ConvertFrom-Json).committed -eq $true) 'fact set did not commit'
          $hits = (ok (u 30 $exe @('search', '--query', 'smoke')) 'search' | ConvertFrom-Json).hits
          check ([bool]($hits | Where-Object { $_.content -eq 'smoke note' })) 'search did not find the note'
          $fact = (ok (u 30 $exe @('fact', 'get', '--key', 'user/smoke')) 'fact get' | ConvertFrom-Json).fact
          check ($fact.content -eq 'ok') 'fact get did not return ok'
          $turns = @((ok (u 30 $exe @('recent', '--n', '1')) 'recent' | ConvertFrom-Json).turns)
          check ($turns.Count -eq 1 -and $turns[0].content -eq 'smoke note') 'recent did not return the note'

      # VS Code counts as installed when its user profile dir exists.
      - name: Set up VS Code and run doctor
        if: steps.release.outputs.skip == 'false'
        run: |
          . $env:SMOKE_LIB
          $exe = $env:SMOKE_EXE
          New-Item -ItemType Directory -Force -Path $env:SMOKE_CODE | Out-Null
          Write-Output (ok (u 60 $exe @('setup', '--yes', '--harness', 'vscode')) 'atticdb setup')
          $entry = (Get-Content -Raw -LiteralPath "$env:SMOKE_CODE\mcp.json" | ConvertFrom-Json).servers.atticdb
          check ($entry.type -eq 'stdio' -and $entry.command -eq $exe) "mcp.json runs $($entry.command), want $exe"
          $hooks = Get-Content -Raw -LiteralPath "$env:SMOKE_HOME\.copilot\hooks\atticdb.json" | ConvertFrom-Json
          $hook = $hooks.hooks.sessionStart[0]
          check ($hook.powershell -like "& '*' hook session-start" -and -not $hook.bash) 'the hook has no powershell line'
          $guide = Get-Content -Raw -LiteralPath "$env:SMOKE_HOME\.copilot\instructions\atticdb.instructions.md"
          check ($guide -match 'atticdb') 'the instructions do not mention atticdb'
          $doctor = u 60 $exe @('doctor')
          Write-Output $doctor.Out
          ok $doctor 'atticdb doctor' | Out-Null
          # The VS Code section, up to the next unindented line.
          $vscode, $on = @(), $false
          foreach ($line in $doctor.Out -split "\r?\n") {
            if ($line -eq 'VS Code:') { $on = $true; continue }
            if ($line -match '^\S') { $on = $false }
            if ($on) { $vscode += $line }
          }
          foreach ($name in 'parts', 'binary', 'hook') {
            check ($vscode -contains "  ${name}: ok") "doctor did not report VS Code ${name}: ok"
          }

      # Runs what VS Code would: the command, args and env of the mcp.json entry.
      - name: MCP round trip
        if: steps.release.outputs.skip == 'false'
        run: |
          . $env:SMOKE_LIB
          $entry = (Get-Content -Raw -LiteralPath "$env:SMOKE_CODE\mcp.json" | ConvertFrom-Json).servers.atticdb
          Write-Output "entry: $($entry | ConvertTo-Json -Compress)"
          $extra = @{}
          if ($entry.env) { foreach ($pair in $entry.env.PSObject.Properties) { $extra[$pair.Name] = [string]$pair.Value } }
          $requests = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"install-smoke","version":"1"}}}'
            '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"memory_search","arguments":{"query":"smoke"}}}'
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"fact_get","arguments":{"key":"user/smoke"}}}'
          )
          # The adapter exits when stdin closes, after answering each request.
          $out = ok (u 30 $entry.command @($entry.args) -Stdin (($requests -join "`n") + "`n") -Extra $extra) 'atticdb mcp'
          Write-Output $out
          $replies = @($out -split "\r?\n" | Where-Object { $_.Trim() } | ForEach-Object { $_ | ConvertFrom-Json })
          check ((($replies | ForEach-Object { $_.id }) -join ',') -eq '1,2,3,4') 'the replies are not ids 1 to 4'
          check ($replies[0].result.serverInfo.name -eq 'atticdb') 'initialize did not name atticdb'
          $tools = ($replies[1].result.tools | ForEach-Object { $_.name } | Sort-Object) -join ','
          check ($tools -eq 'fact_get,fact_list,fact_set,memory_append,memory_recent,memory_search') "tools/list gave $tools"
          $search = $replies[2].result
          check ($search.isError -ne $true -and $search.content[0].text -like '*smoke note*') 'memory_search did not find the note'
          check ([bool]($search.structuredContent.hits | Where-Object { $_.content -eq 'smoke note' })) 'memory_search has no hit'
          check ($replies[3].result.isError -ne $true -and $replies[3].result.content[0].text -eq 'ok') 'fact_get did not return ok'

      # Runs the sessionStart hook as Copilot would on Windows: its powershell line, with its
      # JSON on stdin.
      - name: Session-start hook
        if: steps.release.outputs.skip == 'false'
        run: |
          . $env:SMOKE_LIB
          $hook = (Get-Content -Raw -LiteralPath "$env:SMOKE_HOME\.copilot\hooks\atticdb.json" | ConvertFrom-Json).hooks.sessionStart[0]
          Write-Output "hook: $($hook | ConvertTo-Json -Compress)"
          $extra = @{}
          if ($hook.env) { foreach ($pair in $hook.env.PSObject.Properties) { $extra[$pair.Name] = [string]$pair.Value } }
          $stdin = @{ cwd = $env:SMOKE_PROJ } | ConvertTo-Json -Compress
          $shell = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $out = ok (u 10 $shell @('-NoProfile', '-NonInteractive', '-Command', $hook.powershell) -Stdin $stdin -Extra $extra) 'the hook'
          Write-Output $out
          $context = ($out | ConvertFrom-Json).additionalContext
          check ($context -like '*AtticDB memory*' -and $context -like '*smoke note*' -and $context -like '*user/smoke: ok*') 'the hook did not print the memory block'

      - name: Server log
        if: failure() && steps.release.outputs.skip == 'false'
        run: Get-Content -Tail 50 -LiteralPath "$env:SMOKE_DATA\serve.log" -ErrorAction SilentlyContinue

      # Stops the server the first command started, by the pid in its LOCK, never by name.
      - name: Clean up
        if: always()
        run: |
          if (-not $env:SMOKE_DIR) { exit 0 }
          $lock = Join-Path $env:SMOKE_DATA 'LOCK'
          $text = Get-Content -Raw -LiteralPath $lock -ErrorAction SilentlyContinue
          if ($text -match '^pid=(\d+) ') {
            # A stale LOCK may name a pid that another program now has.
            $server = Get-Process -Id ([int]$Matches[1]) -ErrorAction SilentlyContinue
            if ($server -and $server.ProcessName -eq 'atticdb') {
              Stop-Process -Id $server.Id -Force
              if (-not $server.WaitForExit(10000)) {
                Write-Output "::warning::server $($server.Id) did not stop in 10 s"
              }
            }
          }
          Remove-Item -Recurse -Force -LiteralPath $env:SMOKE_DIR -ErrorAction SilentlyContinue
