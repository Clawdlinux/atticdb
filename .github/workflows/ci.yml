name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain and components from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo test --locked --workspace --release
      - run: cargo test --locked -p atticdb-tape --release --features sim --test sim
        env:
          ATTICDB_SIM_SEEDS: "2000"
      - run: cargo test --locked -p atticdb-core --release --features sim --test engine_sim
        env:
          ATTICDB_SIM_SEEDS: "2000"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r clients/python/requirements-test.txt
      - run: cargo test --locked -p atticdb --release --features fault-inject --test it -- --include-ignored
      # Rebuild without test dev-dependencies, so pytest runs the binary users get, not one with atticdb-tape's sim code.
      - run: cargo build --locked -p atticdb --release --features fault-inject
      - run: ATTICDB_BIN=target/release/atticdb python3 -m pytest clients/python/tests
      # Research code: synthetic fixtures only, no network.
      - run: python3 -m pytest research/ctxcache/tests
      # Stub agents only, never a real model. The end-to-end test runs the binary built above.
      - run: ATTICDB_BIN=target/release/atticdb python3 -m pytest research/setup_eval/tests
      # install.sh against fake releases on 127.0.0.1. It never touches the real HOME.
      - run: python3 -m pytest scripts/tests
      - if: runner.os == 'Linux'
        run: shellcheck install.sh
