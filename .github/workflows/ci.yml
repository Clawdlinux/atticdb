name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --release
      - run: cargo test -p zerodb-tape --release --features sim --test sim
        env:
          ZERODB_SIM_SEEDS: "2000"
      - run: cargo test -p zerodb-core --release --features sim --test engine_sim
        env:
          ZERODB_SIM_SEEDS: "2000"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r clients/python/requirements-test.txt
      - run: cargo test -p zerodb --release --features fault-inject --test it -- --include-ignored
      # Rebuild without test dev-dependencies, so pytest runs the binary users get, not one with zerodb-tape's sim code.
      - run: cargo build -p zerodb --release --features fault-inject
      - run: ZERODB_BIN=target/release/zerodb python3 -m pytest clients/python/tests
