name: release
on:
  # A hand-pushed vX.Y.Z tag publishes that version, such as a patch release.
  push:
    tags: ["v*"]
  # Builds only.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - install.sh
      - install.ps1
      - scripts/crates-publish.sh
      - scripts/brew-formula.sh
      - server.json
      - "**/Cargo.toml"
  # 06:00 UTC on the 1st of each month. Publishes the next minor version when main has new
  # commits since the latest tag.
  schedule:
    - cron: "0 6 1 * *"
  # Builds only, unless publish is set. Then it publishes the next minor version off-cycle.
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the next minor version now"
        type: boolean
        default: false
permissions:
  contents: read
# Runs that may publish share 1 group and never cancel, so 2 never publish at once. Queued
# publishing runs wait their turn. Each computes its version after the run before it has tagged.
# Other runs group by ref. queue: max rules out cancel-in-progress, so pull request runs queue too.
concurrency:
  group: >-
    ${{ (github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish)
    && 'release' || format('release-{0}', github.ref) }}
  cancel-in-progress: false
  queue: max
env:
  CARGO_TERM_COLOR: always
jobs:
  # Decides whether this run publishes, and the version the binaries print. The version comes
  # from the tag, not Cargo.toml. Main is protected, so no bot can commit a version bump.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      # All history and tags, to find the latest tag and count the commits since.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          # Reads releases, to resume a run that tagged but did not publish.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          # Release tags, highest first. Other v* tags are ignored.
          tags() {
            git tag --list 'v*' --sort=-v:refname | grep -E "$semver" || true
          }
          # The highest release tag below $1.
          below() {
            tags | awk -v tag="$1" 'found { print; exit } $0 == tag { found = 1 }'
          }
          # Prints published, draft or missing for the release of tag $1.
          release_state() {
            local out
            if out=$(gh release view "$1" --json isDraft --jq .isDraft 2>&1); then
              if [ "$out" = true ]; then echo draft; else echo published; fi
            elif [ "$out" = "release not found" ]; then
              echo missing
            else
              echo "::error::gh release view $1 failed: $out" >&2
              return 1
            fi
          }
          cargo=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ -z "$cargo" ]; then
            echo "::error::no version in [workspace.package] of Cargo.toml"
            exit 1
          fi
          publish=false
          tag=""
          version="$cargo+ci"
          previous=""
          if [ "$EVENT" = push ]; then
            if ! printf '%s\n' "$REF_NAME" | grep -Eq "$semver"; then
              echo "::error::tag $REF_NAME is not vX.Y.Z"
              exit 1
            fi
            publish=true
            tag=$REF_NAME
            # The highest release tag below this one.
            previous=$(below "$tag")
          elif [ "$EVENT" = schedule ] || [ "$PUBLISH_INPUT" = true ]; then
            if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
              echo "::error::releases publish from $DEFAULT_BRANCH only, not $REF"
              exit 1
            fi
            latest=$(tags | sed -n 1p)
            # A run that tagged HEAD but failed before publishing left the tag behind. Resume it.
            state=""
            if [ -n "$latest" ] && [ "$(git rev-parse "$latest^{commit}")" = "$(git rev-parse HEAD)" ]; then
              state=$(release_state "$latest")
            fi
            if [ -n "$latest" ]; then
              count=$(git rev-list --count "$latest..HEAD")
            else
              count=$(git rev-list --count HEAD)
            fi
            latest=${latest:-v0.0.0}
            if [ "$state" = missing ] || [ "$state" = draft ]; then
              publish=true
              tag=$latest
              previous=$(below "$tag")
              echo "resuming $tag: it is on HEAD and its release is $state"
            elif [ "$count" -eq 0 ]; then
              echo "::notice::no commits since $latest, no release"
            else
              IFS=. read -r major minor _ <<< "${latest#v}"
              publish=true
              tag="v$major.$((10#$minor + 1)).0"
              if [ "$latest" != v0.0.0 ]; then
                previous=$latest
              fi
              echo "releasing $tag, as $latest..HEAD has $count commits"
            fi
          fi
          if [ -n "$tag" ]; then
            version=${tag#v}
          fi
          {
            echo "publish=$publish"
            echo "tag=$tag"
            echo "version=$version"
            echo "previous=$previous"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    needs: version
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    # Bash on every runner, Git Bash on Windows, so the shared steps read $TARGET the same way.
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
      # The binary prints this version. Cargo rebuilds when it changes.
      ATTICDB_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      # Keeps macOS tar from adding ._ files for extended attributes.
      COPYFILE_DISABLE: "1"
      # The profile keeps debug = 1 for local builds. Shipped binaries drop the DWARF and keep
      # symbols, so backtraces still name functions.
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
    steps:
      # Every job checks out github.sha, the commit the publish job tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain and components from rust-toolchain.toml. No build cache, so a
      # release never builds on a cache another run wrote.
      - run: rustup toolchain install
      - run: rustup target add "$TARGET"
      # blake3 compiles C and assembly. cc would look for aarch64-linux-musl-gcc, which Ubuntu
      # does not ship, so name musl-gcc for both targets.
      - if: runner.os == 'Linux'
        # Runner DNS for the Ubuntu mirrors has failed for 10+ minutes at a time (v0.3.1),
        # so retry the whole install for about 10 minutes before giving up.
        run: |
          for try in 1 2 3 4 5 6; do
            if sudo apt-get -o Acquire::Retries=3 update &&
              sudo apt-get -o Acquire::Retries=3 install -y musl-tools; then
              break
            fi
            if [ "$try" = 6 ]; then exit 1; fi
            echo "apt failed, try $try of 6. Retrying in 90 s."
            sleep 90
          done
          echo "CC_$(echo "$TARGET" | tr - _)=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo build --locked --release -p atticdb --target "$TARGET"
      - name: Smoke test
        if: runner.os != 'Windows'
        run: |
          bin="target/$TARGET/release/atticdb"
          info=$(file "$bin")
          echo "$info"
          case "$TARGET" in
            x86_64-apple-darwin)
              # Built on an arm64 runner. Check the arch, don't run it under Rosetta.
              case "$info" in
                *"Mach-O 64-bit executable x86_64"*) ;;
                *) echo "::error::$bin is not an x86_64 Mach-O"; exit 1 ;;
              esac
              exit 0
              ;;
            aarch64-apple-darwin)
              case "$info" in
                *"Mach-O 64-bit executable arm64"*) ;;
                *) echo "::error::$bin is not an arm64 Mach-O"; exit 1 ;;
              esac
              ;;
            *-linux-musl)
              case "$info" in
                *"statically linked"* | *"static-pie linked"*) ;;
                *) echo "::error::$bin is not statically linked"; exit 1 ;;
              esac
              case "$info" in
                *"with debug_info"*) echo "::error::$bin still has debug info"; exit 1 ;;
              esac
              ;;
          esac
          got=$("$bin" --version)
          if [ "$got" != "atticdb $VERSION" ]; then
            echo "::error::$bin --version printed '$got', want 'atticdb $VERSION'"
            exit 1
          fi
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target\$env:TARGET\release\atticdb.exe"
          $got = & $bin --version
          if ($LASTEXITCODE -ne 0 -or "$got" -ne "atticdb $env:VERSION") {
            Write-Output "::error::$bin --version printed '$got', want 'atticdb $env:VERSION'"
            exit 1
          }
          Write-Output $got
      - name: Package
        if: runner.os != 'Windows'
        run: |
          stage=$(mktemp -d)
          cp "target/$TARGET/release/atticdb" README.md LICENSE-APACHE LICENSE-MIT "$stage/"
          mkdir dist
          tar -czf "dist/atticdb-$TARGET.tar.gz" -C "$stage" atticdb README.md LICENSE-APACHE LICENSE-MIT
          tar -tzvf "dist/atticdb-$TARGET.tar.gz"
      # A zip, which Windows opens with no extra tools. The same 4 files, at the top level.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "stage"
          New-Item -ItemType Directory -Path $stage, dist | Out-Null
          $files = "target\$env:TARGET\release\atticdb.exe", "README.md", "LICENSE-APACHE", "LICENSE-MIT"
          Copy-Item -Path $files -Destination $stage
          $zip = "dist\atticdb-$env:TARGET.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          $names = $archive.Entries | ForEach-Object { $_.FullName }
          $archive.Dispose()
          Write-Output $names
          $want = "LICENSE-APACHE", "LICENSE-MIT", "README.md", "atticdb.exe"
          if ((($names | Sort-Object) -join ",") -ne (($want | Sort-Object) -join ",")) {
            Write-Output "::error::$zip holds $($names -join ', '), want $($want -join ', ')"
            exit 1
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atticdb-${{ matrix.target }}
          path: dist/atticdb-${{ matrix.target }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      PREVIOUS: ${{ needs.version.outputs.previous }}
      SHA: ${{ github.sha }}
    steps:
      # All history, for the list of changes since the previous tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: atticdb-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          shopt -s nullglob
          tars=(atticdb-*.tar.gz)
          zips=(atticdb-*.zip)
          if [ "${#tars[@]}" -ne 4 ] || [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::want 5 archives, 4 tarballs and 1 zip, found ${tars[*]} ${zips[*]}"
            exit 1
          fi
          cp ../install.sh ../install.ps1 .
          sha256sum "${tars[@]}" "${zips[@]}" install.sh install.ps1 > SHA256SUMS
          cat SHA256SUMS
      # A scheduled or manual release tags the commit it built. The API creates the tag, so the
      # job needs no git credentials. A tag made with GITHUB_TOKEN starts no other run. A re-run
      # keeps a tag that an earlier attempt put on the same commit.
      - name: Tag the built commit
        if: github.event_name != 'push'
        run: |
          remote=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          # An annotated tag lists its commit on the ^{} line. A lightweight tag has 1 line.
          on=$(printf '%s\n' "$remote" | awk -v ref="refs/tags/$TAG" '
            $2 == ref "^{}" { peeled = $1 } $2 == ref { direct = $1 }
            END { print (peeled != "" ? peeled : direct) }')
          if [ "$on" = "$SHA" ]; then
            echo "tag $TAG is already on $SHA, keeping it"
            exit 0
          fi
          if [ -n "$on" ]; then
            echo "::error::tag $TAG is on $on, not on the built commit $SHA"
            exit 1
          fi
          object=$(gh api "repos/$GH_REPO/git/tags" -f tag="$TAG" -f message="AtticDB $VERSION" \
            -f object="$SHA" -f type=commit --jq .sha)
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" --silent
          echo "tagged $SHA as $TAG"
      - name: Create the release
        run: |
          cat > notes.md <<'EOF'
          Install on macOS or Linux:

          ```sh
          curl -fsSL https://github.com/Clawdlinux/atticdb/releases/latest/download/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"   # needed only if the installer said it isn't on PATH
          atticdb setup
          ```

          Install on Windows, in PowerShell:

          ```powershell
          irm https://github.com/Clawdlinux/atticdb/releases/latest/download/install.ps1 | iex
          atticdb setup
          ```

          Check the files against SHA256SUMS.
          EOF
          if [ -n "$PREVIOUS" ]; then
            {
              echo
              echo "Changes since $PREVIOUS:"
              echo
              git log --format='- %s' "$PREVIOUS..$SHA"
            } >> notes.md
          fi
          cat notes.md
          # gh uploads to a draft, then publishes it. A failed attempt can leave the draft.
          # Delete it and keep the tag, so this attempt starts clean.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            echo "deleting the draft release $TAG left by an earlier attempt"
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" --verify-tag --title "AtticDB $TAG" --notes-file notes.md dist/*

  # Runs the checked-out install.ps1 against the latest release, as a new user would.
  # install.ps1 ships with the next release, so its first test can't use a live copy.
  install-ps1:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install with install.ps1
        shell: pwsh
        env:
          ATTICDB_INSTALL_DIR: ${{ runner.temp }}\atticdb-bin
        run: |
          Get-Content -Raw .\install.ps1 | Invoke-Expression
          $exe = Join-Path $env:ATTICDB_INSTALL_DIR 'atticdb.exe'
          $got = & $exe --version
          if ($LASTEXITCODE -ne 0 -or $got -notmatch '^atticdb \d+\.\d+\.\d+$') {
            Write-Output "::error::$exe --version printed '$got'"
            exit 1
          }
          $user = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not (($user -split ';') -contains $env:ATTICDB_INSTALL_DIR)) {
            Write-Output "::error::install.ps1 did not add $env:ATTICDB_INSTALL_DIR to the user PATH"
            exit 1
          }
          # A second run replaces the binary in place.
          Get-Content -Raw .\install.ps1 | Invoke-Expression
          Write-Output "installed $got"

  # Publishes the crates at the release version. A run that only builds checks that every crate
  # still packages and builds from its package. A rerun skips crates already on crates.io.
  crates:
    needs: [version, publish]
    if: >-
      !cancelled() && needs.version.result == 'success' &&
      (needs.version.outputs.publish != 'true' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLISH: ${{ needs.version.outputs.publish }}
      VERSION: ${{ needs.version.outputs.version }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Publish to crates.io
        run: |
          if [ "$PUBLISH" = true ]; then
            scripts/crates-publish.sh "$VERSION"
          else
            # A build-only run has a +ci version. Package at a placeholder instead.
            scripts/crates-publish.sh 0.0.0 --dry-run
          fi

  # Lists this version in the official MCP registry. It checks the crate on crates.io, so it
  # runs after the crates job. GitHub OIDC proves the io.github.Clawdlinux namespace.
  mcp-registry:
    needs: [version, crates]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: listed
        run: |
          url="https://registry.modelcontextprotocol.io/v0.1/servers/io.github.Clawdlinux%2Fatticdb/versions/$VERSION"
          status=$(curl -s -o /dev/null -w '%{http_code}' "$url")
          case "$status" in
            200) echo "$VERSION is already in the MCP registry"; echo "listed=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "listed=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::the MCP registry answered $status for $url"; exit 1 ;;
          esac
      - if: steps.listed.outputs.listed == 'false'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download and verify mcp-publisher
        if: steps.listed.outputs.listed == 'false'
        run: |
          archive=mcp-publisher_linux_amd64.tar.gz
          base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl -fsSL --retry 3 -o "$archive" "$base/$archive"
          curl -fsSL --retry 3 -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Publish to the MCP registry
        if: steps.listed.outputs.listed == 'false'
        run: |
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  # Writes the formula for this version to Clawdlinux/homebrew-tap. HOMEBREW_TAP_TOKEN may
  # write that repo's contents and nothing else.
  homebrew:
    needs: [version, publish]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update the formula
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set"
            exit 1
          fi
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -O SHA256SUMS
          scripts/brew-formula.sh "$VERSION" SHA256SUMS > atticdb.rb
          path=Formula/atticdb.rb
          current=$(gh api "repos/Clawdlinux/homebrew-tap/contents/$path" --jq .sha)
          if gh api "repos/Clawdlinux/homebrew-tap/contents/$path" -H 'Accept: application/vnd.github.raw' \
            | cmp -s - atticdb.rb; then
            echo "the tap already has atticdb $VERSION"
            exit 0
          fi
          gh api -X PUT "repos/Clawdlinux/homebrew-tap/contents/$path" \
            -f message="atticdb $VERSION" -f sha="$current" \
            -f content="$(base64 -w0 atticdb.rb)" --silent
          echo "the tap now has atticdb $VERSION"
