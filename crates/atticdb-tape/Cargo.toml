[package]
name = "atticdb-tape"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
sim = []

[dependencies]
crc32c = "=0.6.8"
rustix = { version = "=1.1.2", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
proptest = { version = "1.9", default-features = false, features = ["std"] }
atticdb-tape = { path = ".", features = ["sim"] }

[[bench]]
name = "append"
harness = false

[lints]
workspace = true
