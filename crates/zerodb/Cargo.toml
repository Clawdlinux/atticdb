[package]
name = "zerodb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Test-only sync failure trigger. Release builds never enable it.
fault-inject = []

[dependencies]
zerodb-core = { path = "../zerodb-core" }
zerodb-tape = { path = "../zerodb-tape" }
blake3 = "=1.8.7"
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
httparse = { version = "=1.10.1", default-features = false }
rustix = { version = "=1.1.2", default-features = false, features = ["event", "fs", "process", "std"] }

[dev-dependencies]
zerodb-tape = { path = "../zerodb-tape", features = ["sim"] }
proptest = { version = "1.9", default-features = false, features = ["std"] }

[[bin]]
name = "zerodb"
path = "src/main.rs"

[lints]
workspace = true
