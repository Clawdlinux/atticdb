<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>zerodb studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cellipse cx='10' cy='10' rx='5.5' ry='7.5' fill='none' stroke='%230a0a0a' stroke-width='2'/%3E%3Cpath d='M6.6 15.4 13.4 4.6' stroke='%230a0a0a' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="icon-btn" id="menu-open" type="button" aria-label="Open the menu" aria-expanded="false" aria-controls="sidebar">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg>
    </button>
    <svg class="mark" viewBox="0 0 20 20" aria-hidden="true"><ellipse cx="10" cy="10" rx="5.5" ry="7.5"/><path d="M6.6 15.4 13.4 4.6"/></svg>
    <span class="topbar-name">zerodb</span>
    <span class="topbar-screen" id="topbar-screen">Overview</span>
  </header>

  <aside class="sidebar" id="sidebar" aria-label="zerodb studio">
    <div class="brand">
      <svg class="mark" viewBox="0 0 20 20" aria-hidden="true"><ellipse cx="10" cy="10" rx="5.5" ry="7.5"/><path d="M6.6 15.4 13.4 4.6"/></svg>
      <span class="brand-name">zerodb</span>
      <span class="brand-sub">studio</span>
      <button class="icon-btn menu-close" id="menu-close" type="button" aria-label="Close the menu">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <dl class="scope" id="scope">
      <div><dt>Tenant</dt><dd id="scope-tenant">-</dd></div>
      <div><dt>Store</dt><dd id="scope-store">-</dd></div>
      <div class="scope-path"><dt>Path</dt><dd id="scope-path">-</dd></div>
    </dl>
    <nav class="nav" aria-label="Screens">
      <a class="nav-item" href="#/" data-route="overview">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M2.5 7h11M7 7v6.5"/></svg>Overview</a>
      <a class="nav-item" href="#/log" data-route="log">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4h8M5.5 8h8M5.5 12h8M2.5 4h.5M2.5 8h.5M2.5 12h.5"/></svg>Log</a>
      <a class="nav-item" href="#/sessions" data-route="sessions">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11v7.5H7.5L4.5 13.5V11h-2z"/></svg>Sessions</a>
      <a class="nav-item" href="#/facts" data-route="facts">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="5.5" cy="10.5" r="3"/><path d="m7.7 8.3 5.8-5.8M11.5 4.5l1.5 1.5"/></svg>Facts</a>
      <a class="nav-item" href="#/search" data-route="search">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.25"/><path d="m10.2 10.2 3.3 3.3"/></svg>Search</a>
      <a class="nav-item" href="#/chat-start" data-route="chat-start">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="2"/><path d="m5 6.5 2 1.5-2 1.5M8.5 10H11"/></svg>Chat start</a>
    </nav>
    <div class="sidebar-foot">
      <a class="nav-item" href="#/health" data-route="health">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8.5h3l1.5-3.5 2.5 6.5 1.5-3h4.5"/></svg>Health</a>
      <p class="version" id="version">Read only</p>
    </div>
  </aside>

  <main class="canvas" id="main"></main>
</div>
</body>
</html>
