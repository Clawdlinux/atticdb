<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">Read race podium: latest notes and rule lookup</title>
  <desc id="d">A podium for the read race on latest notes and rule lookup. SQLite stands on 1st, Redis on 2nd, and AtticDB on 3rd. The AtticDB box character smiles and holds a sign that says "Happy to be here."</desc>
  <rect width="800" height="450" fill="#FAF7F0"/>
  <g font-family="system-ui, sans-serif" fill="#1a1a1a">
    <text x="30" y="48" font-size="30" font-weight="700">Latest notes and rule lookup.</text>
    <text x="30" y="84" font-size="26">Lower time wins.</text>

    <!-- podium -->
    <rect x="90" y="250" width="200" height="160" fill="#FAF7F0" stroke="#1a1a1a" stroke-width="4"/>
    <rect x="290" y="190" width="200" height="220" fill="#FAF7F0" stroke="#1a1a1a" stroke-width="4"/>
    <rect x="490" y="300" width="200" height="110" fill="#FAF7F0" stroke="#1a1a1a" stroke-width="4"/>
    <line x1="40" y1="410" x2="760" y2="410" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
    <text x="160" y="320" font-size="40" font-weight="700">2nd</text>
    <text x="362" y="262" font-size="40" font-weight="700">1st</text>
    <text x="560" y="362" font-size="40" font-weight="700">3rd</text>

    <!-- names on podium -->
    <text x="148" y="380" font-size="26">Redis</text>
    <text x="350" y="380" font-size="26">SQLite</text>
    <text x="536" y="396" font-size="26">AtticDB</text>

    <!-- trophies as simple stars -->
    <path d="M390 92 L402 122 L434 122 L408 140 L418 172 L390 152 L362 172 L372 140 L346 122 L378 122 Z" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M190 166 L199 188 L222 188 L204 202 L211 226 L190 212 L169 226 L176 202 L158 188 L181 188 Z" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/>

    <!-- AtticDB box character -->
    <rect x="550" y="210" width="80" height="80" rx="10" fill="#E8A23A" stroke="#1a1a1a" stroke-width="4"/>
    <circle cx="576" cy="240" r="5" fill="#1a1a1a"/>
    <circle cx="604" cy="240" r="5" fill="#1a1a1a"/>
    <path d="M572 262 Q590 276 608 262" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
    <line x1="630" y1="250" x2="664" y2="196" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
    <!-- sign -->
    <rect x="556" y="92" width="224" height="104" fill="#FAF7F0" stroke="#1a1a1a" stroke-width="4"/>
    <text x="574" y="134" font-size="28" font-weight="700">Happy to</text>
    <text x="574" y="172" font-size="28" font-weight="700">be here.</text>
  </g>
</svg>
