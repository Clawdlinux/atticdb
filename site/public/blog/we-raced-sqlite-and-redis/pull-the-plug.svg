<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">Pull the plug</title>
  <desc id="d">2 panels. Left: a program says "OK, saved" before the disk has the data, the plug gets pulled, and the note is gone. Right: the program waits for the disk to say done, then says OK, and the note survives the power cut.</desc>
  <rect width="800" height="450" fill="#FAF7F0"/>
  <g font-family="system-ui, sans-serif" fill="#1a1a1a">
    <!-- panels -->
    <rect x="16" y="16" width="376" height="418" fill="none" stroke="#1a1a1a" stroke-width="4"/>
    <rect x="408" y="16" width="376" height="418" fill="none" stroke="#1a1a1a" stroke-width="4"/>
    <text x="36" y="58" font-size="30" font-weight="700">Says OK first</text>
    <text x="428" y="58" font-size="30" font-weight="700">Says OK last</text>
    <rect x="428" y="68" width="190" height="6" fill="#E8A23A"/>

    <!-- left: laptop -->
    <rect x="46" y="96" width="150" height="96" rx="6" fill="none" stroke="#1a1a1a" stroke-width="4"/>
    <line x1="30" y1="204" x2="212" y2="204" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
    <text x="62" y="140" font-size="24" font-weight="600">OK,</text>
    <text x="62" y="172" font-size="24" font-weight="600">saved.</text>
    <!-- left: pulled plug -->
    <path d="M196 180 Q250 200 262 236" fill="none" stroke="#1a1a1a" stroke-width="4"/>
    <rect x="250" y="236" width="26" height="36" fill="#1a1a1a"/>
    <line x1="256" y1="272" x2="256" y2="286" stroke="#1a1a1a" stroke-width="4"/>
    <line x1="270" y1="272" x2="270" y2="286" stroke="#1a1a1a" stroke-width="4"/>
    <rect x="300" y="300" width="60" height="60" rx="8" fill="none" stroke="#1a1a1a" stroke-width="4"/>
    <circle cx="322" cy="330" r="4" fill="#1a1a1a"/>
    <circle cx="338" cy="330" r="4" fill="#1a1a1a"/>
    <path d="M286 292 L298 282 M284 306 L300 306 M290 318 L300 326" stroke="#E8A23A" stroke-width="4" stroke-linecap="round"/>
    <text x="36" y="386" font-size="24">Power cut.</text>
    <text x="36" y="418" font-size="24" font-weight="700">Note: gone.</text>

    <!-- right: laptop -->
    <rect x="438" y="96" width="150" height="96" rx="6" fill="none" stroke="#1a1a1a" stroke-width="4"/>
    <line x1="422" y1="204" x2="604" y2="204" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
    <text x="454" y="140" font-size="24">waiting</text>
    <text x="454" y="172" font-size="24">for disk</text>
    <!-- right: disk -->
    <ellipse cx="700" cy="110" rx="56" ry="16" fill="#E8A23A" stroke="#1a1a1a" stroke-width="4"/>
    <path d="M644 110 V186 Q700 214 756 186 V110" fill="none" stroke="#1a1a1a" stroke-width="4"/>
    <text x="672" y="166" font-size="24">disk</text>
    <path d="M592 150 H630" stroke="#1a1a1a" stroke-width="4"/>
    <path d="M620 140 L634 150 L620 160" fill="none" stroke="#1a1a1a" stroke-width="4"/>
    <text x="440" y="256" font-size="24">1. Disk: done.</text>
    <text x="440" y="292" font-size="24">2. App: OK, saved.</text>
    <text x="440" y="328" font-size="24">3. Plug pulled.</text>
    <text x="428" y="386" font-size="24">Power cut.</text>
    <text x="428" y="418" font-size="24" font-weight="700">Note: still there.</text>
  </g>
</svg>
