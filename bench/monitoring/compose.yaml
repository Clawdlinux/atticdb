# Watch a bench run live. Linux only: host networking, every port on 127.0.0.1.
# ZERODB_SOCKET_DIR is the directory holding zerodb.sock, usually the data directory.
services:
  bridge:
    # Prometheus cannot scrape a Unix socket (prometheus/prometheus#12024).
    image: alpine/socat:1.8.1.3
    network_mode: host
    volumes: ["${ZERODB_SOCKET_DIR:?set ZERODB_SOCKET_DIR}:/zerodb:ro"]
    command: TCP-LISTEN:9425,bind=127.0.0.1,reuseaddr,fork UNIX-CONNECT:/zerodb/zerodb.sock
    restart: unless-stopped
  node:
    image: prom/node-exporter:v1.12.1
    network_mode: host
    pid: host
    volumes: ["/:/host:ro,rslave"]
    command: [--path.rootfs=/host, --web.listen-address=127.0.0.1:9100]
  prometheus:
    image: prom/prometheus:v3.15.1
    network_mode: host
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    command: [--config.file=/etc/prometheus/prometheus.yml, --web.listen-address=127.0.0.1:9090]
  grafana:
    image: grafana/grafana-oss:13.0.2
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/zerodb.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
